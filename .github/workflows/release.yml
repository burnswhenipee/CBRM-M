name: Release

# Push a tag like v2.0.0 to build the program and publish it as a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish CbrConverter/CbrConverter.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = "CBRMixMatch-${{ github.ref_name }}-win-x64"
          New-Item -ItemType Directory -Path $name, "$name/LICENSES" | Out-Null
          Copy-Item publish/CbrConverter.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md -Destination $name
          Copy-Item LICENSES/AGPL-3.0.md -Destination "$name/LICENSES"
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          "CBRMixMatch-${{ github.ref_name }}-win-x64.zip"
          publish/CbrConverter.exe
          --title "CBRMix&Match ${{ github.ref_name }}"
          --generate-notes
