name: Release

# Publishing a release on GitHub (Releases > Draft a new release > Publish) builds the program
# and attaches it to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: >
          dotnet publish CbrConverter/CbrConverter.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package
        shell: pwsh
        run: |
          $name = "CBRMixMatch-${{ github.event.release.tag_name }}-win-x64"
          New-Item -ItemType Directory -Path $name, "$name/LICENSES" | Out-Null
          Copy-Item publish/CbrConverter.exe, README.md, LICENSE, THIRD-PARTY-NOTICES.md -Destination $name
          Copy-Item LICENSES/AGPL-3.0.md -Destination "$name/LICENSES"
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload ${{ github.event.release.tag_name }}
          "CBRMixMatch-${{ github.event.release.tag_name }}-win-x64.zip"
          publish/CbrConverter.exe
          --clobber
